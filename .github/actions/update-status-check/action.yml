name: "Update Status Check"
description: "Use the GitHub Commit Status API to create or update a status
  check on a commit."
inputs:
  check_name:
    description: "The name (context) of the status check to create or update."
    required: true
  status:
    description: "The state to set on the status check. Must be one of: error,
      failure, pending, success."
    required: true
  sha:
    description: "The full 40-character commit SHA to attach the status check to.
      Defaults to the PR head SHA from the event payload if available, otherwise
      the SHA that triggered the workflow. On pull request events the action looks
      up the PR's current head SHA at run time and uses it instead of this input,
      whether defaulted or passed explicitly; the lookup needs `pull-requests:
      read`. If the lookup fails, the action logs a warning and keeps this input."
    required: false
    default: ${{ github.event.pull_request.head.sha || github.sha }}
  description:
    description: "A short human-readable description of the status check."
    required: false
    default: ""
  target_url:
    description: "A URL to associate with the status check, typically a link to
      relevant build or run output."
    required: false
    default: ""
  github_token:
    description: "GitHub token for API access. Defaults to the automatic GITHUB_TOKEN."
    required: false
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    - name: Update Status Check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        CHECK_NAME: ${{ inputs.check_name }}
        STATUS: ${{ inputs.status }}
        SHA: ${{ inputs.sha }}
        DESCRIPTION: ${{ inputs.description }}
        TARGET_URL: ${{ inputs.target_url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        source "${GITHUB_ACTION_PATH}/resolve-head-sha.sh"
        SHA="$(resolve_head_sha "$GITHUB_REPOSITORY" "$PR_NUMBER" "$SHA")"

        if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Error: Invalid sha '${SHA}'. Must be a full 40-character lowercase commit SHA."
          exit 1
        fi

        VALID_STATES=("error" "failure" "pending" "success")
        VALID=false
        for state in "${VALID_STATES[@]}"; do
          if [[ "$STATUS" == "$state" ]]; then
            VALID=true
            break
          fi
        done

        if [[ "$VALID" != "true" ]]; then
          echo "Error: Invalid status '${STATUS}'. Must be one of: error, failure, pending, success."
          exit 1
        fi

        echo "Setting status check '${CHECK_NAME}' to '${STATUS}' on commit ${SHA}..."

        PAYLOAD=$(jq -n \
          --arg state "$STATUS" \
          --arg context "$CHECK_NAME" \
          --arg description "$DESCRIPTION" \
          --arg target_url "$TARGET_URL" \
          '{state: $state, context: $context, description: $description, target_url: $target_url}')

        gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
          --input - <<< "$PAYLOAD"

        echo
        echo "Status check '${CHECK_NAME}' successfully set to '${STATUS}'."
