name: Action Tests

on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ main ]

permissions:
  contents: read

jobs:
  update-status-check:
    name: update-status-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Test head SHA resolution and action wiring
        run: .github/actions/update-status-check/resolve-head-sha.test.sh

  automated-approvals:
    name: automated-approvals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Test the commit-author check and approval revocation
        run: .github/tests/reusable-pr-automated-approvals.test.sh
