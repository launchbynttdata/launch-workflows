name: Deploy Terragrunt Environment

on:
  workflow_call:
    inputs:
      auth_method:
        description: "Comma-delimited list of authentication methods to use. Valid
          values are \"aws\", \"azure\", and \"github\" (e.g. \"aws\",
          \"aws,github\", \"aws,azure\"). Pass an empty string or omit to run
          Terragrunt without any authentication."
        required: false
        default: ""
        type: string
      # --- AWS authentication inputs ---
      aws_auth_region:
        description: "The AWS region to use for authentication. Required if auth_method
          includes 'aws', ignored otherwise."
        required: false
        type: string
      aws_assume_role_arn:
        description: "ARN of the role to assume prior to Terragrunt invocation,
          defaulting to the DEPLOY_ROLE_ARN variable. Required if auth_method
          includes 'aws', ignored otherwise."
        required: false
        default: "${{ vars.DEPLOY_ROLE_ARN }}"
        type: string
      # --- GitHub App authentication inputs ---
      github_app_id:
        description: "The GitHub App ID to use for authentication, defaulting to the
          TERRAGRUNT_DEPLOY_GITHUB_APP_ID variable. Required if auth_method
          includes 'github', ignored otherwise."
        required: false
        default: "${{ vars.TERRAGRUNT_DEPLOY_GITHUB_APP_ID }}"
        type: string
      # --- General workflow configuration ---
      git_branch:
        description: "Branch triggering this deployment."
        required: true
        type: string
      tf_version:
        description: "Version of Terraform to utilize"
        required: true
        default: "1.5.5"
        type: string
      tg_version:
        description: "Version of Terragrunt to utilize"
        required: true
        type: string
      gh_environment:
        description: "GitHub Environment to deploy to (e.g. test, production). Leave blank to use repo-level values."
        required: false
        type: string
      tg_dir:
        description: "Folder containing the Terragrunt configuration to deploy (relative
          to the repository root, e.g. platform/test/us-east-1/000)"
        required: true
        type: string
      before_plan_commands:
        description: "Commands to run prior to executing Terragrunt plan."
        required: false
        type: string
        default: ""
      before_deploy_commands:
        description: "Commands to run prior to executing Terragrunt apply."
        required: false
        type: string
        default: ""
      before_shared_commands:
        description: "Commands to run prior to both Terragrunt plan and apply. These are
          applied after before_plan_commands and before_deploy_commands."
        required: false
        type: string
        default: ""
      after_plan_commands:
        description: "Commands to run after executing Terragrunt plan."
        required: false
        type: string
        default: ""
      after_deploy_commands:
        description: "Commands to run after executing Terragrunt apply."
        required: false
        type: string
        default: ""
      after_shared_commands:
        description: "Commands to run after both Terragrunt plan and apply. These are
          applied after after_plan_commands and after_deploy_commands."
        required: false
        type: string
        default: ""
    outputs:
      terraform_outputs:
        description: "JSON string containing all Terraform outputs from the deployment
          (base64 encoded)"
        value: ${{ jobs.deploy.outputs.terraform_outputs }}
    secrets:
      # --- Azure authentication secrets (required if auth_method includes 'azure') ---
      TERRAGRUNT_DEPLOY_AZURE_CLIENT_ID:
        required: false
      TERRAGRUNT_DEPLOY_AZURE_TENANT_ID:
        required: false
      TERRAGRUNT_DEPLOY_AZURE_SUBSCRIPTION_ID:
        required: false
      # --- GitHub App authentication secrets (required if auth_method includes 'github') ---
      TERRAGRUNT_DEPLOY_GITHUB_APP_SECRET:
        required: false

permissions:
  id-token: write
  contents: read
  statuses: write

jobs:
  validate-inputs:
    name: "Validate Inputs"
    runs-on: ubuntu-latest
    environment: ${{ inputs.gh_environment }}
    outputs:
      auth_aws: ${{ steps.validate.outputs.auth_aws }}
      auth_azure: ${{ steps.validate.outputs.auth_azure }}
      auth_github: ${{ steps.validate.outputs.auth_github }}
    steps:
      - name: Validate inputs and secrets
        id: validate
        shell: bash
        env:
          AUTH_METHOD: ${{ inputs.auth_method }}
          AWS_AUTH_REGION: ${{ inputs.aws_auth_region }}
          AWS_ASSUME_ROLE_ARN: ${{ inputs.aws_assume_role_arn }}
          TERRAGRUNT_DEPLOY_AZURE_CLIENT_ID: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_CLIENT_ID }}
          TERRAGRUNT_DEPLOY_AZURE_TENANT_ID: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_TENANT_ID }}
          TERRAGRUNT_DEPLOY_AZURE_SUBSCRIPTION_ID: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_SUBSCRIPTION_ID }}
          GITHUB_APP_ID: ${{ inputs.github_app_id }}
          TERRAGRUNT_DEPLOY_GITHUB_APP_SECRET: ${{ secrets.TERRAGRUNT_DEPLOY_GITHUB_APP_SECRET }}
        run: |
          auth_aws=false
          auth_azure=false
          auth_github=false

          IFS=',' read -ra AUTH_METHODS <<< "$AUTH_METHOD"
          for method in "${AUTH_METHODS[@]}"; do
            method=$(echo "$method" | xargs)
            [[ -z "$method" ]] && continue
            case "$method" in
              # --- AWS authentication validation ---
              aws)
                auth_aws=true
                if [[ -z "$AWS_AUTH_REGION" ]]; then
                  echo "Error: aws_auth_region input is required when auth_method includes 'aws'."
                  exit 1
                fi
                if [[ -z "$AWS_ASSUME_ROLE_ARN" ]]; then
                  echo "Error: aws_assume_role_arn input is required when auth_method includes 'aws'."
                  exit 1
                fi
                ;;
              # --- Azure authentication validation ---
              azure)
                auth_azure=true
                if [[ -z "$TERRAGRUNT_DEPLOY_AZURE_CLIENT_ID" ]]; then
                  echo "Error: TERRAGRUNT_DEPLOY_AZURE_CLIENT_ID secret is required when auth_method includes 'azure'."
                  exit 1
                fi
                if [[ -z "$TERRAGRUNT_DEPLOY_AZURE_TENANT_ID" ]]; then
                  echo "Error: TERRAGRUNT_DEPLOY_AZURE_TENANT_ID secret is required when auth_method includes 'azure'."
                  exit 1
                fi
                if [[ -z "$TERRAGRUNT_DEPLOY_AZURE_SUBSCRIPTION_ID" ]]; then
                  echo "Error: TERRAGRUNT_DEPLOY_AZURE_SUBSCRIPTION_ID secret is required when auth_method includes 'azure'."
                  exit 1
                fi
                ;;
              # --- GitHub App authentication validation ---
              github)
                auth_github=true
                if [[ -z "$GITHUB_APP_ID" ]]; then
                  echo "Error: github_app_id input is required when auth_method includes 'github'."
                  exit 1
                fi
                if [[ -z "$TERRAGRUNT_DEPLOY_GITHUB_APP_SECRET" ]]; then
                  echo "Error: TERRAGRUNT_DEPLOY_GITHUB_APP_SECRET secret is required when auth_method includes 'github'."
                  exit 1
                fi
                ;;
              *)
                echo "Error: Invalid auth_method '$method'. Valid values are 'aws', 'azure', and 'github'."
                exit 1
                ;;
            esac
          done

          echo "auth_aws=$auth_aws" >> $GITHUB_OUTPUT
          echo "auth_azure=$auth_azure" >> $GITHUB_OUTPUT
          echo "auth_github=$auth_github" >> $GITHUB_OUTPUT

  deploy:
    name: "Plan & Deploy ${{ inputs.tg_dir }}"
    runs-on: ubuntu-latest
    needs: validate-inputs
    environment: ${{ inputs.gh_environment }}
    outputs:
      terraform_outputs: ${{ steps.set-outputs.outputs.terraform_outputs }}
    steps:
      - name: Checkout
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - name: Configure AWS credentials
        if: needs.validate-inputs.outputs.auth_aws == 'true'
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885
        with:
          role-to-assume: ${{ inputs.aws_assume_role_arn }}
          role-session-name: ${{ github.run_id }}
          aws-region: ${{ inputs.aws_auth_region }}

      - name: Azure Login
        if: needs.validate-inputs.outputs.auth_azure == 'true'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_SUBSCRIPTION_ID }}

      - name: "Set default Terraform Tags (AWS)"
        if: needs.validate-inputs.outputs.auth_aws == 'true'
        id: set-tags-aws
        env:
          GIT_BRANCH: ${{ inputs.git_branch }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -x
          repo=$(echo "$REPOSITORY" | cut -d "/" -f 2)
          echo "TF_VAR_organization_tag=$REPO_OWNER" >> "$GITHUB_OUTPUT"
          echo "TF_VAR_repository_tag=$repo" >> "$GITHUB_OUTPUT"
          echo "TF_VAR_commit_hash_tag=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "TF_VAR_branch_tag=$GIT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: "Set default Terraform Tags (Azure)"
        if: needs.validate-inputs.outputs.auth_azure == 'true'
        id: set-tags-azure
        env:
          GIT_BRANCH: ${{ inputs.git_branch }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -x
          repo=$(echo "$REPOSITORY" | cut -d "/" -f 2)
          SYSTEM_TAGS=$(jq -nc \
            --arg org "$REPO_OWNER" \
            --arg repo "$repo" \
            --arg branch "$GIT_BRANCH" \
            --arg sha "$COMMIT_SHA" \
            '{"Organization":$org,"Repository":$repo,"Branch":$branch,"CommitHash":$sha}')
          echo "SYSTEM_TAGS=$SYSTEM_TAGS" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App Token
        id: github-app-token
        if: needs.validate-inputs.outputs.auth_github == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ inputs.github_app_id }}
          private-key: ${{ secrets.TERRAGRUNT_DEPLOY_GITHUB_APP_SECRET }}
          owner: ${{ github.repository_owner }}

      - name: Configure Mise
        id: configure-mise
        uses: launchbynttdata/launch-workflows/.github/actions/terragrunt-configure-mise@0.15.4
        with:
          tf_version: ${{ inputs.tf_version }}
          tg_version: ${{ inputs.tg_version }}

      - name: "Set Terragrunt Plan status to pending"
        uses: launchbynttdata/launch-workflows/.github/actions/update-status-check@0.15.4
        with:
          check_name: "Terragrunt Plan (${{ inputs.tg_dir }})"
          status: "pending"
          description: "Terragrunt plan is running..."
          target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}"

      - name: Plan
        id: plan
        uses: gruntwork-io/terragrunt-action@4ed5b7344c80315e5357f28f36159fc980bc2d5a
        env:
          INPUT_PRE_EXEC_0: |
            ${{ inputs.before_plan_commands }}
          INPUT_PRE_EXEC_1: |
            ${{ inputs.before_shared_commands }}
          INPUT_POST_EXEC_0: |
            ${{ inputs.after_plan_commands }}
          INPUT_POST_EXEC_1: |
            ${{ inputs.after_shared_commands }}
          TF_VAR_organization_tag: ${{ steps.set-tags-aws.outputs.TF_VAR_organization_tag }}
          TF_VAR_repository_tag: ${{ steps.set-tags-aws.outputs.TF_VAR_repository_tag }}
          TF_VAR_commit_hash_tag: ${{ steps.set-tags-aws.outputs.TF_VAR_commit_hash_tag }}
          TF_VAR_branch_tag: ${{ steps.set-tags-aws.outputs.TF_VAR_branch_tag }}
          ARM_CLIENT_ID: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_TENANT_ID }}
          ARM_USE_OIDC: ${{ needs.validate-inputs.outputs.auth_azure == 'true' && 'true'
            || '' }}
          TF_VAR_system_tags: ${{ steps.set-tags-azure.outputs.SYSTEM_TAGS }}
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token || '' }}
        with:
          tf_path: "terraform"
          tg_version: ${{ inputs.tg_version }}
          tg_dir: "${{ inputs.tg_dir }}"
          tg_command: "plan -out=${{ github.sha }}.tfplan"

      - name: "Update Terragrunt Plan status"
        if: always() && steps.plan.outcome != 'skipped'
        uses: launchbynttdata/launch-workflows/.github/actions/update-status-check@0.15.4
        with:
          check_name: "Terragrunt Plan (${{ inputs.tg_dir }})"
          status: ${{ steps.plan.outcome == 'success' && 'success' || steps.plan.outcome
            == 'failure' && 'failure' || 'error' }}
          description: "Terragrunt plan ${{ steps.plan.outcome }}"
          target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}"

      - name: "Set Terragrunt Deploy status to pending"
        uses: launchbynttdata/launch-workflows/.github/actions/update-status-check@0.15.4
        with:
          check_name: "Terragrunt Deploy (${{ inputs.tg_dir }})"
          status: "pending"
          description: "Terragrunt deploy is running..."
          target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}"

      - name: Deploy
        id: deploy
        uses: gruntwork-io/terragrunt-action@4ed5b7344c80315e5357f28f36159fc980bc2d5a
        env:
          INPUT_PRE_EXEC_0: |
            ${{ inputs.before_deploy_commands }}
          INPUT_PRE_EXEC_1: |
            ${{ inputs.before_shared_commands }}
          INPUT_POST_EXEC_0: |
            ${{ inputs.after_deploy_commands }}
          INPUT_POST_EXEC_1: |
            ${{ inputs.after_shared_commands }}
          TF_VAR_organization_tag: ${{ steps.set-tags-aws.outputs.TF_VAR_organization_tag }}
          TF_VAR_repository_tag: ${{ steps.set-tags-aws.outputs.TF_VAR_repository_tag }}
          TF_VAR_commit_hash_tag: ${{ steps.set-tags-aws.outputs.TF_VAR_commit_hash_tag }}
          TF_VAR_branch_tag: ${{ steps.set-tags-aws.outputs.TF_VAR_branch_tag }}
          ARM_CLIENT_ID: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_TENANT_ID }}
          ARM_USE_OIDC: ${{ needs.validate-inputs.outputs.auth_azure == 'true' && 'true'
            || '' }}
          TF_VAR_system_tags: ${{ steps.set-tags-azure.outputs.SYSTEM_TAGS }}
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token || '' }}
        with:
          tf_path: "terraform"
          tg_version: ${{ inputs.tg_version }}
          tg_dir: "${{ inputs.tg_dir }}"
          tg_command: "apply ${{ github.sha }}.tfplan"

      - name: "Update Terragrunt Deploy status"
        if: always() && steps.deploy.outcome != 'skipped'
        uses: launchbynttdata/launch-workflows/.github/actions/update-status-check@0.15.4
        with:
          check_name: "Terragrunt Deploy (${{ inputs.tg_dir }})"
          status: ${{ steps.deploy.outcome == 'success' && 'success' ||
            steps.deploy.outcome == 'failure' && 'failure' || 'error' }}
          description: "Terragrunt deploy ${{ steps.deploy.outcome }}"
          target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}"

      - name: Get Terraform Outputs
        id: set-outputs
        working-directory: "${{ inputs.tg_dir }}"
        env:
          ARM_CLIENT_ID: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_TENANT_ID }}
          ARM_USE_OIDC: ${{ needs.validate-inputs.outputs.auth_azure == 'true' && 'true'
            || '' }}
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token || '' }}
        run: |
          echo "=== Getting Terraform outputs ==="
          TF_OUTPUTS=$(terragrunt output -json 2>/dev/null | jq 'with_entries(select(.value.sensitive != true))' || echo '{}')
          echo "Raw outputs:"
          echo "$TF_OUTPUTS" | jq '.'

          # Base64 encode for safe transfer
          ENCODED_OUTPUTS=$(echo "$TF_OUTPUTS" | base64 -w 0)
          echo "terraform_outputs=$ENCODED_OUTPUTS" >> "$GITHUB_OUTPUT"
          echo "=== Outputs captured and encoded ==="
