name: Plan Terragrunt Environment

on:
  workflow_call:
    inputs:
      auth_method:
        description: "Comma-delimited list of authentication methods to use. Valid
          values are \"aws\", \"azure\", and \"github\" (e.g. \"aws\",
          \"aws,github\", \"aws,azure\"). Pass an empty string or omit to run
          Terragrunt without any authentication."
        required: false
        default: ""
        type: string
      # --- AWS authentication inputs ---
      aws_auth_region:
        description: "The AWS region to use for authentication. Required if auth_method
          includes 'aws', ignored otherwise."
        required: false
        type: string
      aws_assume_role_arn:
        description: "ARN of the role to assume prior to Terragrunt invocation. Required
          if auth_method includes 'aws', ignored otherwise."
        required: false
        type: string
      # --- GitHub App authentication inputs ---
      github_app_id:
        description: "The GitHub App ID to use for authentication, defaulting to the
          TERRAGRUNT_DEPLOY_GITHUB_APP_ID variable. Required if auth_method
          includes 'github', ignored otherwise."
        required: false
        default: "${{ vars.TERRAGRUNT_DEPLOY_GITHUB_APP_ID }}"
        type: string
      # --- General workflow configuration ---
      git_branch:
        description: "Branch triggering this plan"
        required: true
        type: string
      tf_version:
        description: "Version of Terraform to utilize"
        required: true
        default: "1.5.5"
        type: string
      tg_version:
        description: "Version of Terragrunt to utilize"
        required: true
        type: string
      tg_dir:
        description: "Folder containing the Terragrunt configuration to plan (relative
          to the repository root, e.g. platform/test/us-east-1/000)"
        required: true
        type: string
      before_plan_commands:
        description: "Commands to run prior to executing Terragrunt plan."
        required: false
        type: string
        default: ""
      after_plan_commands:
        description: "Commands to run after executing Terragrunt plan."
        required: false
        type: string
        default: ""
    secrets:
      # --- Azure authentication secrets (required if auth_method includes 'azure') ---
      TERRAGRUNT_DEPLOY_AZURE_CLIENT_ID:
        required: false
      TERRAGRUNT_DEPLOY_AZURE_TENANT_ID:
        required: false
      TERRAGRUNT_DEPLOY_AZURE_SUBSCRIPTION_ID:
        required: false
      # --- GitHub App authentication secrets (required if auth_method includes 'github') ---
      TERRAGRUNT_DEPLOY_GITHUB_APP_SECRET:
        required: false

permissions:
  id-token: write
  pull-requests: read
  contents: read
  statuses: write

jobs:
  validate-inputs:
    name: "Validate Inputs"
    runs-on: ubuntu-latest
    outputs:
      auth_aws: ${{ steps.validate.outputs.auth_aws }}
      auth_azure: ${{ steps.validate.outputs.auth_azure }}
      auth_github: ${{ steps.validate.outputs.auth_github }}
    steps:
      - name: Validate inputs and secrets
        id: validate
        shell: bash
        run: |
          auth_aws=false
          auth_azure=false
          auth_github=false

          IFS=',' read -ra AUTH_METHODS <<< "${{ inputs.auth_method }}"
          for method in "${AUTH_METHODS[@]}"; do
            method=$(echo "$method" | xargs)
            [[ -z "$method" ]] && continue
            case "$method" in
              # --- AWS authentication validation ---
              aws)
                auth_aws=true
                if [[ -z "${{ inputs.aws_auth_region }}" ]]; then
                  echo "Error: aws_auth_region input is required when auth_method includes 'aws'."
                  exit 1
                fi
                if [[ -z "${{ inputs.aws_assume_role_arn }}" ]]; then
                  echo "Error: aws_assume_role_arn input is required when auth_method includes 'aws'."
                  exit 1
                fi
                ;;
              # --- Azure authentication validation ---
              azure)
                auth_azure=true
                if [[ -z "${{ secrets.TERRAGRUNT_DEPLOY_AZURE_CLIENT_ID }}" ]]; then
                  echo "Error: TERRAGRUNT_DEPLOY_AZURE_CLIENT_ID secret is required when auth_method includes 'azure'."
                  exit 1
                fi
                if [[ -z "${{ secrets.TERRAGRUNT_DEPLOY_AZURE_TENANT_ID }}" ]]; then
                  echo "Error: TERRAGRUNT_DEPLOY_AZURE_TENANT_ID secret is required when auth_method includes 'azure'."
                  exit 1
                fi
                if [[ -z "${{ secrets.TERRAGRUNT_DEPLOY_AZURE_SUBSCRIPTION_ID }}" ]]; then
                  echo "Error: TERRAGRUNT_DEPLOY_AZURE_SUBSCRIPTION_ID secret is required when auth_method includes 'azure'."
                  exit 1
                fi
                ;;
              # --- GitHub App authentication validation ---
              github)
                auth_github=true
                if [[ -z "${{ inputs.github_app_id }}" ]]; then
                  echo "Error: github_app_id input is required when auth_method includes 'github'."
                  exit 1
                fi
                if [[ -z "${{ secrets.TERRAGRUNT_DEPLOY_GITHUB_APP_SECRET }}" ]]; then
                  echo "Error: TERRAGRUNT_DEPLOY_GITHUB_APP_SECRET secret is required when auth_method includes 'github'."
                  exit 1
                fi
                ;;
              *)
                echo "Error: Invalid auth_method '$method'. Valid values are 'aws', 'azure', and 'github'."
                exit 1
                ;;
            esac
          done

          echo "auth_aws=$auth_aws" >> $GITHUB_OUTPUT
          echo "auth_azure=$auth_azure" >> $GITHUB_OUTPUT
          echo "auth_github=$auth_github" >> $GITHUB_OUTPUT

  plan:
    name: "Plan ${{ inputs.tg_dir }}"
    runs-on: ubuntu-latest
    needs: validate-inputs
    steps:
      - name: Checkout
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493
      - name: Configure AWS credentials
        if: needs.validate-inputs.outputs.auth_aws == 'true'
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ inputs.aws_assume_role_arn }}
          role-session-name: ${{ github.run_id }}
          aws-region: ${{ inputs.aws_auth_region }}

      - name: Azure Login
        if: needs.validate-inputs.outputs.auth_azure == 'true'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_SUBSCRIPTION_ID }}

      - name: "Set default Terraform Tags (AWS)"
        if: needs.validate-inputs.outputs.auth_aws == 'true'
        id: set-tags-aws
        run: |
          set -x
          echo "TF_VAR_organization_tag=${{ github.repository_owner }}" >> "$GITHUB_OUTPUT"
          echo "TF_VAR_repository_tag=$(echo "${{ github.repository }}" | cut -d "/" -f 2)" >> "$GITHUB_OUTPUT"
          echo "TF_VAR_commit_hash_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "TF_VAR_branch_tag=${{ inputs.git_branch }}" >> "$GITHUB_OUTPUT"

      - name: "Set default Terraform Tags (Azure)"
        if: needs.validate-inputs.outputs.auth_azure == 'true'
        id: set-tags-azure
        run: |
          set -x
          repo=$(echo "${{ github.repository }}" | cut -d "/" -f 2)
          echo "SYSTEM_TAGS={\"Organization\":\"${{ github.repository_owner }}\",\"Repository\":\"$repo\",\"Branch\":\"${{ inputs.git_branch }}\",\"CommitHash\":\"${{ github.sha }}\"}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App Token
        id: github-app-token
        if: needs.validate-inputs.outputs.auth_github == 'true'
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          app-id: ${{ inputs.github_app_id }}
          private-key: ${{ secrets.TERRAGRUNT_DEPLOY_GITHUB_APP_SECRET }}
          owner: ${{ github.repository_owner }}

      - name: Configure Mise
        id: configure-mise
        uses: launchbynttdata/launch-workflows/.github/actions/terragrunt-configure-mise@0.15.0
        with:
          tf_version: ${{ inputs.tf_version }}
          tg_version: ${{ inputs.tg_version }}

      - name: "Set Terragrunt Plan status to pending"
        uses: launchbynttdata/launch-workflows/.github/actions/update-status-check@0.15.0
        with:
          check_name: "Terragrunt Plan (${{ inputs.tg_dir }})"
          status: "pending"
          description: "Terragrunt plan is running..."
          target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}"

      - name: Plan
        id: plan
        uses: gruntwork-io/terragrunt-action@5e86476ca61eaf74adb9c0525745f29f921f2199
        env:
          INPUT_PRE_EXEC_0: |
            ${{ inputs.before_plan_commands }}
          INPUT_POST_EXEC_0: |
            ${{ inputs.after_plan_commands }}
          TF_VAR_organization_tag: ${{ steps.set-tags-aws.outputs.TF_VAR_organization_tag }}
          TF_VAR_repository_tag: ${{ steps.set-tags-aws.outputs.TF_VAR_repository_tag }}
          TF_VAR_commit_hash_tag: ${{ steps.set-tags-aws.outputs.TF_VAR_commit_hash_tag }}
          TF_VAR_branch_tag: ${{ steps.set-tags-aws.outputs.TF_VAR_branch_tag }}
          ARM_CLIENT_ID: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.TERRAGRUNT_DEPLOY_AZURE_TENANT_ID }}
          ARM_USE_OIDC: ${{ needs.validate-inputs.outputs.auth_azure == 'true' && 'true'
            || '' }}
          TF_VAR_system_tags: ${{ steps.set-tags-azure.outputs.SYSTEM_TAGS }}
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token || '' }}
        with:
          tf_path: "terraform"
          tg_version: ${{ inputs.tg_version }}
          tg_dir: "${{ inputs.tg_dir }}"
          tg_command: "plan"

      - name: "Update Terragrunt Plan status"
        if: always() && steps.plan.outcome != 'skipped'
        uses: launchbynttdata/launch-workflows/.github/actions/update-status-check@0.15.0
        with:
          check_name: "Terragrunt Plan (${{ inputs.tg_dir }})"
          status: ${{ steps.plan.outcome == 'success' && 'success' || steps.plan.outcome
            == 'failure' && 'failure' || 'error' }}
          description: "Terragrunt plan ${{ steps.plan.outcome }}"
          target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}"
