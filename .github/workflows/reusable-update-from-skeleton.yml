name: Update Repository from Skeleton

on:
  workflow_call:
    inputs:
      recopy:
        description:
          "Perform a full recopy instead of an incremental update (overwrites
          all templated files), and re-runs any tasks defined in copier.yml. The
          resulting PR will require manual review and merging."
        type: boolean
        default: false
      skeleton_update_app_id:
        description:
          "The GitHub App ID of the app to use for authentication when
          pushing updates. The app must be installed on the repository and have
          permissions to read and write code, as well as create pull requests."
        required: false
        type: string
        default: ${{ vars.LAUNCH_SKELETON_UPDATE_APP_ID }}
    secrets:
      LAUNCH_SKELETON_UPDATE_KEY:
        description:
          "The private key for the GitHub App used for authentication when
          pushing updates. The app must be installed on the repository and have
          permissions to read and write code, as well as create pull requests."
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-from-skeleton:
    name: Update from Skeleton
    runs-on: ubuntu-latest
    steps:
      - id: get-app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          app-id: ${{ inputs.skeleton_update_app_id }}
          private-key: ${{ secrets.LAUNCH_SKELETON_UPDATE_KEY }}

      - id: checkout
        name: Checkout Repository
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493
        with:
          token: ${{ steps.get-app-token.outputs.token }}

      - name: Setup asdf
        uses: asdf-vm/actions/setup@b7bcd026f18772e44fe1026d729e1611cc435d47

      - uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        name: Restore cached asdf tools
        id: cache
        with:
          path: ~/.asdf
          key: ${{ runner.os }}-tool-versions-${{ hashFiles('.tool-versions') }}

      - name: Install asdf tools
        run: asdf install

      - uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        name: Cache asdf tools
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/.asdf
          key: ${{ runner.os }}-tool-versions-${{ hashFiles('.tool-versions') }}

      - id: setup-python
        name: Set up Python 3.14
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          python-version: 3.14

      - id: install-tools
        name: Install Tools with uv
        run: |
          uv tool install copier
          uv tool install pre-commit --with pre-commit-uv

      - id: get-repo-custom-properties
        name: Get Repository Custom Properties
        uses: launchbynttdata/launch-workflows/.github/actions/get-custom-properties@0.15.0

      - id: run-updates
        name: Run Updates from Skeleton
        env:
          RECOPY: ${{ inputs.recopy }}
          CUSTOM_PROPERTIES: ${{ steps.get-repo-custom-properties.outputs.properties }}
        run: |
          PRERELEASE=$(echo "$CUSTOM_PROPERTIES" | jq -r '.[] | select(.property_name == "prerelease") | .value')

          COPIER_CMD="update"
          COPIER_FLAGS="--defaults --trust"
          if [ "$RECOPY" == "true" ]; then
            COPIER_CMD="recopy"
            COPIER_FLAGS="$COPIER_FLAGS --overwrite"
          fi

          if [ "$PRERELEASE" == "true" ]; then
            echo "Using prerelease versions of skeleton workflows ($COPIER_CMD)"
            uv run copier $COPIER_CMD $COPIER_FLAGS --prereleases
          else
            echo "Using stable versions of skeleton workflows ($COPIER_CMD)"
            uv run copier $COPIER_CMD $COPIER_FLAGS
          fi

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes detected"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "### ✅ No Updates Available" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The repository is already up to date with the skeleton template." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Changes detected"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "### 🔄 Updates Available" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Changes were detected from the skeleton template. A pull request will be created." >> "$GITHUB_STEP_SUMMARY"
            if [ ! -f .pre-commit-config.yaml ]; then
              echo "No .pre-commit-config.yaml found, skipping pre-commit validation"
              echo "pre_commit_passed=false" >> "$GITHUB_OUTPUT"
              {
                echo "PRE_COMMIT_OUTPUT<<__PRECOMMIT_EOF__"
                echo "No .pre-commit-config.yaml found in repository. Pre-commit validation was skipped."
                echo "__PRECOMMIT_EOF__"
              } >> "$GITHUB_ENV"
            else
              PRE_COMMIT_LOG=$(mktemp)
              set -o pipefail
              if ! pre-commit run check-merge-conflict --all-files 2>&1 | tee "$PRE_COMMIT_LOG"; then
                PRE_COMMIT_OUTPUT=$(cat "$PRE_COMMIT_LOG")
                rm -f "$PRE_COMMIT_LOG"

                echo "Pre-commit checks failed"
                echo "pre_commit_passed=false" >> "$GITHUB_OUTPUT"

                CONFLICT_FILES=$(echo "$PRE_COMMIT_OUTPUT" | grep ': Merge conflict' | sed 's/:[0-9]*: Merge conflict.*//' | sort -u) || true

                {
                  echo "PRE_COMMIT_OUTPUT<<__PRECOMMIT_EOF__"
                  echo "$PRE_COMMIT_OUTPUT"
                  echo "__PRECOMMIT_EOF__"
                } >> "$GITHUB_ENV"

                if [ -n "$CONFLICT_FILES" ]; then
                  {
                    echo "CONFLICT_FILES<<__CONFLICTS_EOF__"
                    echo "$CONFLICT_FILES"
                    echo "__CONFLICTS_EOF__"
                  } >> "$GITHUB_ENV"
                fi
              else
                rm -f "$PRE_COMMIT_LOG"
                echo "No merge conflicts detected, running all pre-commit checks"
                pre-commit run --all-files || pre-commit run --all-files
                echo "Pre-commit checks passed"
                echo "pre_commit_passed=true" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

      - name: Commit and Push Changes
        id: commit-and-push
        if: steps.run-updates.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
          APP_SLUG: ${{ steps.get-app-token.outputs.app-slug }}
          PRE_COMMIT_PASSED: ${{ steps.run-updates.outputs.pre_commit_passed }}
          RECOPY: ${{ inputs.recopy }}
        run: |
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)

          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          BRANCH_NAME="patch/skeleton-update-$(date +%Y%m%d-%H%M%S)"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH_NAME"

          # Files coming from a release in the template repo are assumed to be trusted,
          # as they've been through the PR review process in that repository.
          git add .

          if [ "$PRE_COMMIT_PASSED" == "true" ] && [ "$RECOPY" != "true" ]; then
            git commit -m "chore: update from skeleton"
          else
            git commit -m "fix: update from skeleton"
          fi

          git push origin "$BRANCH_NAME"

      - name: Create Pull Request
        if: steps.run-updates.outputs.has_changes == 'true' &&
          steps.run-updates.outputs.pre_commit_passed == 'true' && inputs.recopy
          != true
        env:
          GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
          BRANCH_NAME: ${{ steps.commit-and-push.outputs.branch_name }}
        run: |
          PR_BODY=$(cat <<-'EOF'
          Automated update from skeleton template.

          No conflicting changes were detected from the base repository.
          EOF
          )
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore: update from skeleton" \
            --body "$PR_BODY")
          gh pr merge "$BRANCH_NAME" --auto --squash
          echo "### ✅ Pull Request Created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Auto-merge has been enabled." >> "$GITHUB_STEP_SUMMARY"

      - name: Create Pull Request (requires review)
        if: steps.run-updates.outputs.has_changes == 'true' &&
          (steps.run-updates.outputs.pre_commit_passed == 'false' ||
          inputs.recopy == true)
        env:
          GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
          BRANCH_NAME: ${{ steps.commit-and-push.outputs.branch_name }}
          RECOPY: ${{ inputs.recopy }}
          PRE_COMMIT_PASSED: ${{ steps.run-updates.outputs.pre_commit_passed }}
        run: |
          if [ "$RECOPY" == "true" ] && [ "$PRE_COMMIT_PASSED" == "true" ]; then
            PR_BODY=$(cat <<-'EOF'
          Automated recopy from skeleton template.

          All templated files have been overwritten. Please review the changes carefully before merging.
          EOF
            )
          else
            PR_BODY=$(cat <<-EOF
          Automated update from skeleton template.

          ⚠️ Problems occurred during pre-commit validation. Manual review and conflict resolution may be required before merging.

          Pre-commit output:
          $(echo "$PRE_COMMIT_OUTPUT" | sed 's/^/> /')
          EOF
            )

            if [ -n "$CONFLICT_FILES" ]; then
              CONFLICT_LIST=$(echo "$CONFLICT_FILES" | sed 's/^/- `/' | sed 's/$/`/')
              PR_BODY="${PR_BODY}

          The following files contain merge conflict markers:
          ${CONFLICT_LIST}"
            fi
          fi
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "fix: update from skeleton" \
            --body "$PR_BODY")
          echo "### ⚠️ Pull Request Created (requires review)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This PR requires manual review before merging." >> "$GITHUB_STEP_SUMMARY"
